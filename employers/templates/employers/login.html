{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — ERO Database</title>
  <link rel="stylesheet" href="{% static 'employers/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'employers/css/custom.css' %}">
  <style>
    body { background: #f0f2f5; }
    .login-card {
      max-width: 400px;
      margin: 100px auto 0;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1);
    }
  </style>
</head>
<body>

<div class="card login-card">
  <div class="card-body p-4">

    <!-- Header -->
    <div class="text-center mb-4">
      <h4 class="fw-bold mb-0">ERO Hub</h4>
      <p class="text-muted small">Employer Relations Office — CMU-Q</p>
    </div>

    <!-- Login form -->
    <form method="post">
      {% csrf_token %}

      {% if form.errors %}
      <div class="alert alert-danger py-2">
        Incorrect username or password. Please try again.
      </div>
      {% endif %}

      <div class="mb-3">
        <label for="{{ form.username.id_for_label }}" class="form-label fw-semibold">Username</label>
        <input type="text"
               name="username"
               id="{{ form.username.id_for_label }}"
               class="form-control form-control-lg"
               autofocus
               autocomplete="username"
               required>
      </div>

      <div class="mb-4">
        <label for="{{ form.password.id_for_label }}" class="form-label fw-semibold">Password</label>
        <input type="password"
               name="password"
               id="{{ form.password.id_for_label }}"
               class="form-control form-control-lg"
               autocomplete="current-password"
               required>
      </div>

      {% if next %}
      <input type="hidden" name="next" value="{{ next }}">
      {% endif %}

      <button type="submit" class="btn btn-primary btn-lg w-100">Sign In</button>
    </form>

    <p class="text-center text-muted small mt-3 mb-0">
      No account? Ask your administrator to run<br>
      <code>python manage.py createsuperuser</code>
    </p>

  </div>
</div>

<script src="{% static 'employers/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
