# Employer Relations CRM — nginx site (TLS termination and reverse proxy).
#
# Installed by deploy/install.sh (never over an existing file):
#   Ubuntu/Debian: /etc/nginx/sites-available/ero-crm.conf, enabled with a symlink in
#                  /etc/nginx/sites-enabled/
#   RHEL family:   /etc/nginx/conf.d/ero-crm.conf (every *.conf there is loaded)
#
# Before enabling it, replace every CHANGE_ME (server name and certificate paths), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# RHEL family with SELinux enforcing: allow nginx to connect to the application
# on 127.0.0.1:3000, once:
#   sudo setsebool -P httpd_can_network_connect 1
#
# This file is included inside nginx's http { } block, so the zone and log
# format below are defined at http level.

# Brute-force protection for the sign-in endpoints: 10 attempts a minute per
# client address, short bursts allowed. The application has its own limit too.
limit_req_zone $binary_remote_addr zone=ero_crm_login:10m rate=10r/m;

# Access log without the query string: search terms can be personal data.
# $uri is the path only (no ?query); $request is deliberately not logged.
log_format ero_crm_privacy '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                           '$status $body_bytes_sent $request_time "$http_user_agent"';

# HTTP: redirect everything to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name CHANGE_ME.example.edu;
    server_tokens off;
    access_log /var/log/nginx/ero-crm/access.log ero_crm_privacy;
    error_log /var/log/nginx/ero-crm/error.log warn;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.25.1 and later prefer "http2 on;" instead of "http2" on the listen line.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CHANGE_ME.example.edu;
    server_tokens off;

    # Certificate: full chain (server certificate first, then intermediates) and private key.
    ssl_certificate     /etc/ssl/CHANGE_ME/ero-crm.fullchain.pem;
    ssl_certificate_key /etc/ssl/CHANGE_ME/ero-crm.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ero_crm_tls:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/ero-crm/access.log ero_crm_privacy;
    error_log /var/log/nginx/ero-crm/error.log warn;

    # Uploads (spreadsheet imports) are limited by the application to 5 MB.
    client_max_body_size 6m;
    client_body_timeout 30s;
    send_timeout 60s;
    keepalive_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # The application also sends this header; send exactly one.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # Reports and exports can take a while on a large database.
    proxy_read_timeout 120s;

    # Static files: long browser cache. Nothing else is cached.
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /vendor/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Sign-in endpoints: rate limited.
    location = /login {
        limit_req zone=ero_crm_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/auth/login {
        limit_req zone=ero_crm_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
