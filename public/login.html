<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="view-transition" content="same-origin">
  <style>html,body{background-color:#f5f6fa!important;margin:0}@view-transition{navigation:auto}</style>
  <title>Sign In — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .brand-icon { width: 64px; height: 64px; background: #4361ee; border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  </style>
</head>
<body>
  <div class="login-card bg-white p-4 p-md-5">
    <div class="text-center mb-4">
      <div class="brand-icon">
        <i class="bi bi-building-check text-white fs-3"></i>
      </div>
      <h5 class="fw-bold mb-1">ERO System</h5>
      <p class="text-muted small mb-0">CMU-Q Employer Relations Office</p>
    </div>

    <div id="error-alert" class="alert alert-danger d-none small py-2"></div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="f-username" class="form-control" placeholder="admin" autofocus required>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="f-password" class="form-control" placeholder="••••••••" required>
          <button type="button" class="btn btn-outline-secondary" id="toggle-pw" tabindex="-1">
            <i class="bi bi-eye" id="toggle-pw-icon"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 fw-semibold" id="btn-login">
        Sign In
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('toggle-pw').addEventListener('click', () => {
      const pw   = document.getElementById('f-password');
      const icon = document.getElementById('toggle-pw-icon');
      const show = pw.type === 'password';
      pw.type    = show ? 'text' : 'password';
      icon.className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('error-alert');
      err.classList.add('d-none');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('f-username').value.trim(),
            password: document.getElementById('f-password').value,
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        window.location.href = '/index.html';
      } catch (e) {
        err.textContent = e.message;
        err.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>
