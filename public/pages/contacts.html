<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="view-transition" content="same-origin">
  <style>html,body{background-color:#f5f6fa!important;margin:0}@view-transition{navigation:auto}</style>
  <title>Contacts — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Sidebar -->
<div id="sidebar-placeholder" style="position:fixed;top:0;left:0;bottom:0;width:240px;background:#212529;z-index:999"></div>

<!-- Main content -->
<div class="main-content">

  <!-- Toast container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

  <!-- Page header -->
  <div class="page-sticky-top">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-people me-2 text-primary"></i>Contacts</h4>
      <p class="text-muted small mb-0">Manage employer contacts</p>
      <small id="page-last-updated" data-entity="contacts" class="text-muted"></small>
    </div>
    <button class="btn btn-primary" id="btn-add">
      <i class="bi bi-plus-lg me-1"></i>Add Contact
    </button>
  </div>

  <!-- Search + filters -->
  <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
    <div class="input-group" style="max-width:340px">
      <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
      <input type="text" id="search-input" class="form-control" placeholder="Search by name or email…">
    </div>
    <select id="filter-status" class="form-select" style="max-width:180px">
      <option value="">All statuses</option>
      <option value="Mailable">Mailable</option>
      <option value="Non-mailable">Non-mailable</option>
    </select>
    <select id="filter-company" class="form-select" style="max-width:220px">
      <option value="">All companies</option>
    </select>
    <span id="record-count" class="badge bg-secondary ms-auto"></span>
  </div>
  <p class="text-muted small mb-3 legend-row">
    <span class="legend-item"><span class="entity-indicator entity-indicator-primary"><i class="bi bi-star-fill"></i></span> Primary contact</span>
    <span class="legend-item"><span class="badge badge-semantic badge-semantic-neutral badge-semantic-subtle">Excluded</span> Excluded from mailing</span>
  </p>

  <!-- Table -->
  </div><!-- /.page-sticky-top -->

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Company</th>
            <th>Email</th>
            <th>Job Title</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="contacts-tbody">
          <tr><td colspan="6" class="text-center py-4">
            <div class="spinner-border spinner-border-sm text-secondary"></div> Loading…
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── Add/Edit Modal ─────────────────────────────────────────────────────── -->
<div class="modal fade" id="contact-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Add Contact</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <form id="contact-form" novalidate>
        <div class="modal-body">
          <div class="row g-3">

            <!-- Company -->
            <div class="col-12">
              <label class="form-label">Company <span class="text-danger">*</span></label>
              <select id="f-company" class="form-select" required>
                <option value="">Select company…</option>
              </select>
            </div>

            <!-- First Name / Last Name -->
            <div class="col-md-6">
              <label class="form-label">First Name <span class="text-danger">*</span></label>
              <input type="text" id="f-firstname" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name <span class="text-danger">*</span></label>
              <input type="text" id="f-lastname" class="form-control" required>
            </div>

            <!-- Email -->
            <div class="col-md-8">
              <label class="form-label">Email Address <span class="text-danger">*</span></label>
              <input type="email" id="f-email" class="form-control" required>
            </div>

            <!-- Date Added -->
            <div class="col-md-4">
              <label class="form-label">Date Added <span class="text-danger">*</span></label>
              <input type="date" id="f-date-added" class="form-control" required>
            </div>

            <!-- ── Contact Info (blueprint field order) ───────────── -->
            <div class="col-12"><hr class="my-1"><p class="text-muted small mb-0 fw-semibold">Contact Information</p></div>

            <div class="col-md-6">
              <label class="form-label">Work Phone</label>
              <input type="tel" id="f-workphone" class="form-control" placeholder="+974 …">
            </div>
            <div class="col-md-6">
              <label class="form-label">Mobile</label>
              <input type="tel" id="f-mobile" class="form-control" placeholder="+974 …">
            </div>
            <div class="col-md-6">
              <label class="form-label">Job Title</label>
              <input type="text" id="f-jobtitle" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Country</label>
              <input type="text" id="f-country" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Address</label>
              <input type="text" id="f-address" class="form-control">
            </div>

            <!-- ── Online Profiles ───────────────────────────────── -->
            <div class="col-12"><hr class="my-1"><p class="text-muted small mb-0 fw-semibold">Online Profiles</p></div>

            <div class="col-md-6">
              <label class="form-label">LinkedIn URL</label>
              <input type="url" id="f-linkedin" class="form-control" placeholder="https://linkedin.com/…">
            </div>
            <div class="col-md-6">
              <label class="form-label">Handshake URL</label>
              <input type="url" id="f-handshake" class="form-control" placeholder="https://app.joinhandshake.com/…">
            </div>

            <!-- ── CMU-Q Graduate ─────────────────────────────────── -->
            <div class="col-12"><hr class="my-1"><p class="text-muted small mb-0 fw-semibold">CMU-Q Alumni</p></div>

            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f-cmuq">
                <label class="form-check-label fw-semibold" for="f-cmuq">CMU-Q Graduate</label>
              </div>
            </div>

            <!-- Conditional: Major + Graduation Year -->
            <div id="cmuq-fields" class="col-12 d-none">
              <div class="row g-3 ms-1 border-start border-primary border-2 ps-2">
                <div class="col-md-8">
                  <label class="form-label">Major</label>
                  <select id="f-major" class="form-select">
                    <option value="">Select major…</option>
                    <option>Computer Science</option>
                    <option>Information Systems</option>
                    <option>Biological Sciences</option>
                    <option>Business Administration</option>
                    <option>Artificial Intelligence</option>
                    <option>Computational Biology</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label">Graduation Year</label>
                  <input type="number" id="f-gradyear" class="form-control" min="1990" max="2050" placeholder="2024">
                </div>
              </div>
            </div>

            <!-- ── Mailing & Status ───────────────────────────────── -->
            <div class="col-12"><hr class="my-1"><p class="text-muted small mb-0 fw-semibold">Mailing & Status</p></div>

            <div class="col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f-primary">
                <label class="form-check-label" for="f-primary">
                  <i class="bi bi-star-fill text-warning me-1"></i>Primary Contact
                </label>
              </div>
            </div>

            <div class="col-md-6">
              <label class="form-label d-block">Status</label>
              <div class="form-check form-switch mt-1">
                <input class="form-check-input" type="checkbox" role="switch" id="f-status" style="width:2.5em;height:1.25em">
                <label class="form-check-label" for="f-status">Mailable</label>
              </div>
            </div>

            <div class="col-md-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f-resumebook">
                <label class="form-check-label" for="f-resumebook">Resume Book</label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f-eventinvite">
                <label class="form-check-label" for="f-eventinvite">Event Invitation</label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f-excludemail">
                <label class="form-check-label text-danger" for="f-excludemail">
                  <i class="bi bi-envelope-x me-1"></i>Exclude from Mailing
                </label>
              </div>
            </div>

          </div><!-- /row -->
        </div><!-- /modal-body -->

        <div class="modal-footer d-flex justify-content-between">
          <button type="button" class="btn btn-outline-danger d-none" id="btn-delete">
            <i class="bi bi-trash me-1"></i>Delete
          </button>
          <div class="ms-auto d-flex gap-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
          </div>
        </div>
      </form>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/contacts.js"></script>
</body>
</html>
