<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="view-transition" content="same-origin">
  <style>html,body{background-color:#f5f6fa!important;margin:0}@view-transition{navigation:auto}</style>
  <title>Recruitment — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar-placeholder" style="position:fixed;top:0;left:0;bottom:0;width:240px;background:#212529;z-index:999"></div>
<div class="main-content">
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>
  <div class="page-sticky-top">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-briefcase me-2 text-primary"></i>Recruitment</h4>
      <p class="text-muted small mb-0">Job and internship postings</p>
      <small id="page-last-updated" data-entity="recruitment" class="text-muted"></small>
    </div>
    <button class="btn btn-primary" id="btn-add"><i class="bi bi-plus-lg me-1"></i>Add Posting</button>
  </div>

  <div class="d-flex flex-wrap gap-2 mb-3">
    <div class="input-group" style="max-width:260px">
      <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
      <input type="text" id="search-input" class="form-control" placeholder="Search company or title…" aria-label="Search recruitment postings">
    </div>
    <select id="filter-mode"   class="form-select" style="max-width:150px" aria-label="Filter by mode"><option value="">All modes</option><option>Onsite</option><option>Hybrid</option><option>Remote</option></select>
    <select id="filter-status" class="form-select" style="max-width:140px" aria-label="Filter by compensation"><option value="">All compensation</option><option>Paid</option><option>Unpaid</option></select>
    <input type="date" id="filter-from" class="form-control" style="max-width:155px" title="From date" aria-label="From date">
    <input type="date" id="filter-to"   class="form-control" style="max-width:155px" title="To date" aria-label="To date">  </div>

  </div><!-- /.page-sticky-top -->

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th data-sort-key="CompanyName">Company</th><th data-sort-key="OpportunityTitle">Title</th><th data-sort-key="DatePosted">Date Posted</th><th data-sort-key="Mode">Mode</th><th data-sort-key="Status">Status</th><th data-sort-key="TargetGroup">Target</th><th data-sort-key="HiredStudentAlumni">Hired</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="8" class="text-center py-4">
            <div class="spinner-border spinner-border-sm text-secondary"></div> Loading…
          </td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="the-modal" tabindex="-1" aria-labelledby="modal-title">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Add Recruitment</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="recruitment-form" novalidate>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="f-company">Company <span class="text-danger">*</span></label>
              <select id="f-company" class="form-select" required><option value="">Select…</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="f-contact">Contact <span class="text-danger">*</span></label>
              <select id="f-contact" class="form-select" required><option value="">Select…</option></select>
            </div>

            <div class="col-12">
              <span class="form-label fw-semibold d-block">Opportunity Type (select all that apply)</span>
              <div id="chk-opp-types" class="border rounded p-2"></div>
            </div>

            <div class="col-md-4">
              <label class="form-label" for="f-date">Date Posted <span class="text-danger">*</span></label>
              <input type="date" id="f-date" class="form-control" required>
            </div>
            <div class="col-md-8">
              <label class="form-label" for="f-title">Opportunity Title <span class="text-danger">*</span></label>
              <input type="text" id="f-title" class="form-control" required>
            </div>

            <div class="col-12">
              <span class="form-label fw-semibold d-block">Collect Applications Via</span>
              <div id="chk-collect" class="border rounded p-2"></div>
            </div>

            <div class="col-md-4">
              <label class="form-label" for="f-duration">Duration</label>
              <input type="text" id="f-duration" class="form-control" placeholder="e.g. 3 months">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="f-hire-start">Hiring Start Date</label>
              <input type="date" id="f-hire-start" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="f-hire-end">Hiring End Date</label>
              <input type="date" id="f-hire-end" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="f-country">Country</label>
              <input type="text" id="f-country" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label" for="f-mode">Mode <span class="text-danger">*</span></label>
              <select id="f-mode" class="form-select" required>
                <option value="">Select…</option><option>Onsite</option><option>Hybrid</option><option>Remote</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="f-pay-status">Status <span class="text-danger">*</span></label>
              <select id="f-pay-status" class="form-select" required>
                <option value="">Select…</option><option>Paid</option><option>Unpaid</option>
              </select>
            </div>
            <div class="col-md-4 d-none" id="pay-amount-row">
              <label class="form-label" for="f-pay-amount">Pay Amount</label>
              <input type="text" id="f-pay-amount" class="form-control" placeholder="e.g. QAR 5,000/month">
            </div>

            <div class="col-12">
              <span class="form-label fw-semibold d-block">Target Majors</span>
              <div id="chk-majors" class="border rounded p-2"></div>
            </div>
            <div class="col-12">
              <span class="form-label fw-semibold d-block">Class Level</span>
              <div id="chk-classlevel" class="border rounded p-2"></div>
            </div>

            <div class="col-md-6">
              <label class="form-label" for="f-target-group">Target Group <span class="text-danger">*</span></label>
              <select id="f-target-group" class="form-select" required>
                <option value="">Select…</option><option>Qatari only</option><option>Open to all</option>
              </select>
            </div>
            <div class="col-md-3 d-flex align-items-end pb-2">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="f-arabic">
                <label class="form-check-label" for="f-arabic">Arabic Speaker Required</label>
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="f-hired">Hired Student/Alumni</label>
              <select id="f-hired" class="form-select">
                <option value="Not Reported">Not Reported</option><option>Yes</option><option>No</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="f-comment">Comment</label>
              <textarea id="f-comment" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" class="btn btn-outline-danger d-none" id="btn-delete"><i class="bi bi-trash me-1"></i>Delete</button>
          <div class="ms-auto d-flex gap-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/recruitment.js"></script>
</body>
</html>
