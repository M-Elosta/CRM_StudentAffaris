<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="view-transition" content="same-origin">
  <style>html,body{background-color:#f5f6fa!important;margin:0}@view-transition{navigation:auto}</style>
  <title>Reports — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── Report cards ── */
    .report-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      padding: 18px 14px;
      cursor: pointer;
      transition: all .2s ease;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-height: 110px;
      position: relative;
    }
    .report-card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,.13);
      transform: translateY(-3px);
      border-color: #c5cff9;
    }
    .report-card.active {
      border-color: #4361ee;
      background: #f0f3ff;
      box-shadow: 0 4px 16px rgba(67,97,238,.2);
    }
    .report-card.active::after {
      content: '';
      position: absolute;
      top: 8px; right: 8px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4361ee;
    }

    /* ── Card icon circle ── */
    .card-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .card-icon-wrap i { font-size: 1.35rem; }
    .card-title { font-size: 13px; font-weight: 700; color: #1a1d23; margin-bottom: 3px; line-height: 1.3; }
    .card-desc  { font-size: 11px; color: #868e96; line-height: 1.35; }

    /* ── Report grid ── */
    .report-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 8px;
    }
    @media (max-width: 1400px) { .report-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 1100px) { .report-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px)  { .report-grid { grid-template-columns: repeat(2, 1fr); } }

    /* ── Section header ── */
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .section-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: 20px;
      padding: 5px 14px 5px 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: #495057;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .section-divider { flex: 1; height: 1px; background: #e9ecef; }

    /* ── Results panel ── */
    #results-section { scroll-margin-top: 80px; }
    #quick-chart { max-height: 300px; }
    .result-table th { white-space: nowrap; font-size: 12px; }
    .result-table td { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .report-card:focus-visible {
      outline: 3px solid rgba(67,97,238,.35);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
<div id="sidebar-placeholder" style="position:fixed;top:0;left:0;bottom:0;width:240px;background:#212529;z-index:999"></div>
<div class="main-content">
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

  <!-- ── Page Header ── -->
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-file-earmark-bar-graph me-2 text-primary"></i>Reports</h4>
      <p class="text-muted small mb-0">Generate, visualise, and export data</p>
    </div>
  </div>
  <!-- ── Filter Bar ── -->
  <div class="card mb-4" style="border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid #e9ecef">
    <div class="card-body py-3 px-4">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <label class="small fw-semibold text-muted mb-0" for="rep-view-mode">View By</label>
        <select id="rep-view-mode" class="form-select form-select-sm" style="width:170px">
          <option value="date">Custom Dates</option>
          <option value="semester">Semester</option>
          <option value="academic-year">Academic Year</option>
        </select>
        <div id="rep-semester-wrap" class="d-flex flex-wrap align-items-center gap-2 d-none">
          <label class="small fw-semibold text-muted mb-0" for="rep-semester">Semester</label>
          <select id="rep-semester" class="form-select form-select-sm" style="width:200px"></select>
        </div>
        <div id="rep-ay-wrap" class="d-flex flex-wrap align-items-center gap-2 d-none">
          <label class="small fw-semibold text-muted mb-0" for="rep-academic-year">Academic Year</label>
          <select id="rep-academic-year" class="form-select form-select-sm" style="width:180px"></select>
        </div>
        <div id="rep-date-wrap" class="d-flex flex-wrap align-items-center gap-2">
        <label class="small fw-semibold text-muted mb-0" for="rep-from">From</label>
        <input type="date" id="rep-from" class="form-control form-control-sm" style="width:150px">
        <label class="small fw-semibold text-muted mb-0" for="rep-to">To</label>
        <input type="date" id="rep-to" class="form-control form-control-sm" style="width:150px">
        </div>
        <div class="vr d-none d-sm-block" style="height:1.5rem"></div>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="rep-show-all" role="switch" checked>
          <label class="form-check-label fw-semibold small" for="rep-show-all">Show All</label>
        </div>
        <span id="rep-period-caption" class="small text-muted ms-sm-2">All time</span>
      </div>
    </div>
  </div>

  <!-- ── Report Sections (rendered by JS) ── -->
  <div id="report-sections"></div>

  <!-- ── Results Panel ── -->
  <div id="results-section" class="d-none mt-2">
    <div class="card" style="border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.1);border:1px solid #e9ecef">
      <div class="card-body p-4">

        <!-- Results header -->
        <div class="d-flex flex-wrap align-items-start gap-2 mb-3">
          <div class="me-auto">
            <h5 class="fw-bold mb-1" id="qr-title"></h5>
            <span class="text-muted small" id="qr-count"></span>
          </div>
          <button class="btn btn-sm btn-outline-primary d-none" id="btn-download-png" disabled>
            <i class="bi bi-image me-1"></i>Chart PNG
          </button>
          <button class="btn btn-sm btn-outline-secondary" id="btn-print-quick" disabled>
            <i class="bi bi-printer me-1"></i>Print
          </button>
          <button class="btn btn-sm btn-success" id="btn-quick-export" disabled>
            <i class="bi bi-file-earmark-excel me-1"></i>Export Excel
          </button>
        </div>

        <!-- Loading -->
        <div id="quick-loading" class="text-center py-5 d-none">
          <div class="spinner-border text-primary mb-3" style="width:2.5rem;height:2.5rem"></div>
          <p class="text-muted mb-0 fw-semibold">Loading report…</p>
        </div>

        <!-- Chart -->
        <div id="chart-wrapper" class="mb-4 d-none" style="background:#f8f9fa;border-radius:10px;padding:20px 16px">
          <canvas id="quick-chart"></canvas>
        </div>

        <!-- Table -->
        <div id="quick-table-wrap" class="d-none">
          <div class="table-responsive" style="border-radius:8px;border:1px solid #e9ecef;max-height:480px;overflow-y:auto">
            <table class="table table-hover table-striped table-sm mb-0 align-middle result-table">
              <thead class="table-light sticky-top" id="quick-thead"></thead>
              <tbody id="quick-tbody"></tbody>
            </table>
          </div>
        </div>

        <!-- Empty -->
        <div id="quick-empty" class="text-center text-muted py-4 d-none">
          <i class="bi bi-inbox fs-2 d-block mb-2 opacity-50"></i>
          <p class="mb-0 fw-semibold">No records found for the selected period.</p>
        </div>

      </div>
    </div>
  </div>

</div><!-- /main-content -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/reports.js"></script>
</body>
</html>
