<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="view-transition" content="same-origin">
  <style>html,body{background-color:#f5f6fa!important;margin:0}@view-transition{navigation:auto}</style>
  <title>Academic Engagement — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar-placeholder" style="position:fixed;top:0;left:0;bottom:0;width:240px;background:#212529;z-index:999"></div>
<div class="main-content">
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

  <div class="page-sticky-top">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-book me-2 text-primary"></i>Academic Engagement</h4>
      <p class="text-muted small mb-0">Track guest lectures, panel discussions, and academic collaborations</p>
      <small id="page-last-updated" data-entity="academic" class="text-muted"></small>
    </div>
    <button class="btn btn-primary" id="btn-add"><i class="bi bi-plus-lg me-1"></i>Add Record</button>
  </div>

  <!-- Filters -->
  <div class="d-flex flex-wrap gap-2 mb-3">
    <div class="input-group" style="max-width:280px">
      <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
      <input type="text" id="search-input" class="form-control" placeholder="Search company or speaker…">
    </div>
    <select id="filter-type" class="form-select" style="max-width:220px">
      <option value="">All types</option>
      <option value="Guest Lecture">Guest Lecture</option>
      <option value="Panel Discussion">Panel Discussion</option>
      <option value="Community Project Partnership">Community Project Partnership</option>
      <option value="Mock Interviews">Mock Interviews</option>
      <option value="Research Collaboration">Research Collaboration</option>
      <option value="Competition/Hackathon Sponsorship">Competition/Hackathon Sponsorship</option>
      <option value="Other">Other</option>
    </select>
    <input type="date" id="filter-from" class="form-control" style="max-width:160px" title="From date">
    <input type="date" id="filter-to"   class="form-control" style="max-width:160px" title="To date">  </div>

  </div><!-- /.page-sticky-top -->

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Company</th><th>Type</th><th>Guest Speaker</th>
            <th>Faculty</th><th>Course</th><th>Session Date</th><th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="the-modal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Add Academic Engagement</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="academic-form" novalidate>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Company <span class="text-danger">*</span></label>
              <select id="f-company" class="form-select" required><option value="">Select company…</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contact <span class="text-danger">*</span></label>
              <select id="f-contact" class="form-select" required><option value="">Select contact…</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Engagement Type <span class="text-danger">*</span></label>
              <select id="f-type" class="form-select" required>
                <option value="">Select type…</option>
                <option value="Guest Lecture">Guest Lecture</option>
                <option value="Panel Discussion">Panel Discussion</option>
                <option value="Community Project Partnership">Community Project Partnership</option>
                <option value="Mock Interviews">Mock Interviews</option>
                <option value="Research Collaboration">Research Collaboration</option>
                <option value="Competition/Hackathon Sponsorship">Competition/Hackathon Sponsorship</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Guest Speaker Name <span class="text-danger">*</span></label>
              <input type="text" id="f-speaker" class="form-control" required placeholder="Full name">
            </div>
            <div class="col-md-6">
              <label class="form-label">Guest Title <span class="text-danger">*</span></label>
              <input type="text" id="f-guest-title" class="form-control" required placeholder="e.g. Senior Engineer">
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" id="f-email" class="form-control" placeholder="speaker@example.com">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number</label>
              <input type="text" id="f-phone" class="form-control" placeholder="+974 XXXX XXXX">
            </div>
            <div class="col-md-4">
              <label class="form-label">Faculty Name <span class="text-danger">*</span></label>
              <input type="text" id="f-faculty" class="form-control" required placeholder="Faculty member name">
            </div>
            <div class="col-md-4">
              <label class="form-label">Course Number <span class="text-danger">*</span></label>
              <input type="text" id="f-course-num" class="form-control" required placeholder="e.g. CS101">
            </div>
            <div class="col-md-4">
              <label class="form-label">Course Title <span class="text-danger">*</span></label>
              <input type="text" id="f-course-title" class="form-control" required placeholder="Course title">
            </div>
            <div class="col-12">
              <label class="form-label">Topic / Theme <span class="text-danger">*</span></label>
              <input type="text" id="f-topic" class="form-control" required placeholder="Session topic or theme">
            </div>
            <div class="col-md-6">
              <label class="form-label">Session Date <span class="text-danger">*</span></label>
              <input type="date" id="f-session-date" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Session Time <span class="text-danger">*</span></label>
              <input type="time" id="f-session-time" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label">Comment</label>
              <textarea id="f-comment" class="form-control" rows="3" placeholder="Additional notes…"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" class="btn btn-outline-danger d-none" id="btn-delete"><i class="bi bi-trash me-1"></i>Delete</button>
          <div class="ms-auto d-flex gap-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/academic.js"></script>
</body>
</html>
