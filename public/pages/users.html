<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="view-transition" content="same-origin">
  <style>html,body{background-color:#f5f6fa!important;margin:0}@view-transition{navigation:auto}</style>
  <title>Manage Users — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar-placeholder" style="position:fixed;top:0;left:0;bottom:0;width:240px;background:#212529;z-index:999"></div>
<div class="main-content">
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

  <!-- Page Header -->
  <div class="page-sticky-top">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-people-fill me-2 text-primary"></i>Manage Users</h4>
      <p class="text-muted small mb-0">Add users, set roles, and manage access</p>
    </div>
    <button class="btn btn-primary" id="btn-add-user">
      <i class="bi bi-plus-lg me-1"></i>Add User
    </button>
  </div>

  <!-- Access denied banner (shown for viewers) -->
  <div id="access-denied" class="d-none">
    <div class="alert alert-warning d-flex align-items-center gap-2">
      <i class="bi bi-shield-exclamation fs-4"></i>
      <div><strong>Admin access required.</strong> You do not have permission to manage users.</div>
    </div>
  </div>

  <!-- Users table -->
  <div id="users-content" class="d-none">
  </div><!-- /.page-sticky-top -->

    <div class="card" style="border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid #e9ecef">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-sm mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th class="px-3">Username</th>
                <th>Role</th>
                <th>Created</th>
                <th class="text-end px-3">Actions</th>
              </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="add-user-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Add New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="add-user-form">
        <div class="modal-body">
          <div id="add-user-error" class="alert alert-danger d-none small py-2"></div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
            <input type="text" id="new-username" class="form-control" required autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
            <input type="password" id="new-password" class="form-control" required minlength="12" autocomplete="new-password">
            <div class="form-text">Minimum 12 characters.</div>
          </div>
          <div class="mb-0">
            <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
            <select id="new-role" class="form-select" required>
              <option value="admin">Admin — full access</option>
              <option value="viewer">Viewer — read-only access</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-user">
            <i class="bi bi-check-lg me-1"></i>Create User
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
