<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>/* FOUC guard: paint app bg before external CSS loads */html,body{background-color:#f5f6fa}</style>
  <title>Hiring Feedback — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar-placeholder"></div>
<div class="main-content">
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-star me-2 text-primary"></i>Hiring Feedback</h4>
      <p class="text-muted small mb-0">Track student and alumni hiring outcomes</p>
    </div>
    <button class="btn btn-primary" id="btn-add"><i class="bi bi-plus-lg me-1"></i>Add Feedback</button>
  </div>
  <div class="d-flex flex-wrap gap-2 mb-3">
    <div class="input-group" style="max-width:260px">
      <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
      <input type="text" id="search-input" class="form-control" placeholder="Search company or contact…">
    </div>
    <select id="filter-provider" class="form-select" style="max-width:180px">
      <option value="">All providers</option><option>Company</option><option>Student/Alumni</option><option>Other</option>
    </select>
    <select id="filter-hired" class="form-select" style="max-width:140px">
      <option value="">Hired?</option><option>Yes</option><option>No</option>
    </select>
    <input type="date" id="filter-from" class="form-control" style="max-width:155px" title="From date">
    <input type="date" id="filter-to"   class="form-control" style="max-width:155px" title="To date">
  </div>
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr><th>Company</th><th>Contact</th><th>Provider</th><th>Hired?</th><th>Date Reported</th><th>Student Name</th><th class="text-end">Actions</th></tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="7" class="text-center py-4"><div class="spinner-border spinner-border-sm text-secondary"></div> Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal fade" id="the-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Add Hiring Feedback</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="the-form" novalidate>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Company <span class="text-danger">*</span></label>
              <select id="f-company" class="form-select" required><option value="">Select…</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contact <span class="text-danger">*</span></label>
              <select id="f-contact" class="form-select" required><option value="">Select…</option></select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Feedback Provider <span class="text-danger">*</span></label>
              <select id="f-provider" class="form-select" required>
                <option value="">Select…</option><option>Company</option><option>Student/Alumni</option><option>Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Hired a Student/Alumni? <span class="text-danger">*</span></label>
              <select id="f-hired" class="form-select" required>
                <option value="">Select…</option><option>Yes</option><option>No</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Date Reported <span class="text-danger">*</span></label>
              <input type="date" id="f-date" class="form-control" required>
            </div>
            <div class="col-md-6 d-none" id="hired-name-row">
              <label class="form-label">Hired Student Name</label>
              <input type="text" id="f-student-name" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Comment</label>
              <textarea id="f-comment" class="form-control" rows="2"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" class="btn btn-outline-danger d-none" id="btn-delete"><i class="bi bi-trash me-1"></i>Delete</button>
          <div class="ms-auto d-flex gap-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/hiring-feedback.js"></script>
</body>
</html>
