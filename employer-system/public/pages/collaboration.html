<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <style>/* FOUC guard: paint app bg + sidebar before external CSS loads */html,body{background-color:#f5f6fa}@media(min-width:768px){body::before{content:"";position:fixed;top:0;left:0;bottom:0;width:240px;background:#212529;z-index:-1}}</style>
  <title>Potential Collaboration — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar-placeholder"></div>
<div class="main-content">
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 class="mb-0 fw-bold"><i class="bi bi-diagram-3 me-2 text-primary"></i>Potential Collaboration</h4>
      <p class="text-muted small mb-0">Track potential collaboration opportunities with employers</p>
    </div>
    <button class="btn btn-primary" id="btn-add"><i class="bi bi-plus-lg me-1"></i>Add Record</button>
  </div>

  <!-- Filters -->
  <div class="d-flex flex-wrap gap-2 mb-3">
    <div class="input-group" style="max-width:280px">
      <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
      <input type="text" id="search-input" class="form-control" placeholder="Search company…">
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0 align-middle">
        <thead class="table-light">
          <tr>
            <th>Company</th><th>Opportunities</th><th>Comment</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="the-modal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title">Add Collaboration</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form id="collaboration-form" novalidate>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">Company <span class="text-danger">*</span></label>
              <select id="f-company" class="form-select" required><option value="">Select company…</option></select>
            </div>
            <div class="col-12">
              <label class="form-label">Collaboration Opportunities</label>
              <div id="chk-opps" class="mt-1"></div>
            </div>
            <div class="col-12">
              <label class="form-label">Comment</label>
              <textarea id="f-comment" class="form-control" rows="3" placeholder="Additional notes…"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" class="btn btn-outline-danger d-none" id="btn-delete"><i class="bi bi-trash me-1"></i>Delete</button>
          <div class="ms-auto d-flex gap-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/collaboration.js"></script>
</body>
</html>
