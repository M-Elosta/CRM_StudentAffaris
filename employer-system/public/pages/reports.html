<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reports — ERO System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="sidebar-placeholder"></div>
<div class="main-content">
  <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999"></div>

  <div class="mb-4">
    <h4 class="mb-0 fw-bold"><i class="bi bi-file-earmark-bar-graph me-2 text-primary"></i>Reports</h4>
    <p class="text-muted small mb-0">Generate and export data reports</p>
  </div>

  <!-- Controls -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label fw-semibold">Report Type</label>
          <select id="report-type" class="form-select">
            <option value="">Select report…</option>
            <option value="companies">Companies (non-blacklisted)</option>
            <option value="mailable">Mailable Contacts</option>
            <option value="event_invitation">Event Invitation List</option>
            <option value="resume_book">Resume Book Contacts</option>
            <option value="non_mailable">Non-Mailable Contacts</option>
            <option value="follow_up">Follow-Up Action Items</option>
            <option value="engagement_summary">Employer Engagement Summary</option>
            <option value="recruitment">Recruitment Postings</option>
            <option value="career_events">Career Event Attendance</option>
            <option value="hiring_feedback">Hiring Feedback</option>
            <option value="job_outreach">Contacts for Job/Internship Outreach</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">From</label>
          <input type="date" id="filter-from" class="form-control">
        </div>
        <div class="col-md-2">
          <label class="form-label fw-semibold">To</label>
          <input type="date" id="filter-to" class="form-control">
        </div>
        <div class="col-md-4 d-flex gap-2">
          <button class="btn btn-primary flex-grow-1" id="btn-preview">
            <i class="bi bi-eye me-1"></i>Preview
          </button>
          <button class="btn btn-success flex-grow-1" id="btn-export" disabled>
            <i class="bi bi-download me-1"></i>Export Excel
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="results-section" class="d-none">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h6 class="mb-0 fw-semibold" id="results-title"></h6>
      <span class="badge bg-secondary" id="results-count"></span>
    </div>
    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover table-sm mb-0 align-middle" id="results-table">
          <thead class="table-light" id="results-thead"></thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="empty-state" class="text-center text-muted py-5">
    <i class="bi bi-bar-chart-line fs-1 d-block mb-2"></i>
    Select a report type and click Preview to see results.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/reports.js"></script>
</body>
</html>
